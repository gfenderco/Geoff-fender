<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>whack-a-dot</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
    touch-action: manipulation;
  }
  #site-nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 42px;
    background: #0a0a0a;
    border-bottom: 1px solid #1f1f1f;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 10px;
    overflow-x: auto;
    z-index: 1000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    white-space: nowrap;
  }
  #site-nav a {
    color: #888;
    text-decoration: none;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 5px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  #site-nav a:hover { color: #fff; background: #1a1a1a; }
  #site-nav a.active { color: #000; background: #fff; }
  #game-area {
    position: fixed;
    top: 42px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    cursor: pointer;
  }
  #dot {
    position: absolute;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 20px rgba(255,255,255,0.7);
    display: none;
  }
  #hud {
    position: absolute;
    top: 16px;
    left: 16px;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    opacity: 0.7;
    user-select: none;
    line-height: 1.6;
  }
  #hud .row { display: flex; gap: 6px; }
  #hud .label { opacity: 0.6; }
  #msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 22px;
    text-align: center;
    user-select: none;
  }
  #msg span {
    display: block;
    opacity: 0.6;
    font-size: 14px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<nav id="site-nav">
  <a href="index.html">Shrink Box</a>
  <a href="reaction.html">Reaction</a>
  <a href="dodge.html">Dodge</a>
  <a href="whack.html">Whack-a-Dot</a>
  <a href="memory.html">Memory</a>
  <a href="colormatch.html">Color Match</a>
</nav>

<div id="game-area">
  <div id="hud">
    <div class="row"><span class="label">time:</span><span id="time">20.0s</span></div>
    <div class="row"><span class="label">score:</span><span id="score">0</span></div>
    <div class="row"><span class="label">best:</span><span id="best">—</span></div>
  </div>
  <div id="dot"></div>
  <div id="msg">click to start<span>whack as many dots as you can in 20 seconds</span></div>
</div>

<script>
  (function () {
    var links = document.querySelectorAll('#site-nav a');
    var here = location.pathname.split('/').pop() || 'index.html';
    links.forEach(function (a) {
      if (a.getAttribute('href') === here) a.classList.add('active');
    });
  })();

  var area = document.getElementById('game-area');
  var dot = document.getElementById('dot');
  var timeEl = document.getElementById('time');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var msg = document.getElementById('msg');

  var ROUND_MS = 20000;
  var DOT_LIFE = 800;
  var DOT_SIZE = 54;

  var BEST_KEY = 'whack_best_score';

  function getBest() {
    var v = null;
    try { v = localStorage.getItem(BEST_KEY); } catch (e) {}
    return v ? parseInt(v, 10) : null;
  }
  function setBest(s) {
    try { localStorage.setItem(BEST_KEY, String(s)); } catch (e) {}
  }
  function renderBest() {
    var b = getBest();
    bestEl.textContent = b !== null ? b : '—';
  }

  var state = 'idle';
  var score = 0;
  var roundEnd = null;
  var dotTimeout = null;
  var spawnTimeout = null;
  var timerRaf = null;

  function updateScore() {
    scoreEl.textContent = score;
  }

  function spawnDot() {
    if (state !== 'playing') return;
    var half = DOT_SIZE / 2;
    var maxX = Math.max(1, area.clientWidth - DOT_SIZE);
    var maxY = Math.max(1, area.clientHeight - DOT_SIZE);
    var x = Math.random() * maxX;
    var y = Math.random() * maxY;
    dot.style.left = x + 'px';
    dot.style.top = y + 'px';
    dot.style.display = 'block';
    dotTimeout = setTimeout(function () {
      dot.style.display = 'none';
      spawnTimeout = setTimeout(spawnDot, 150 + Math.random() * 250);
    }, DOT_LIFE);
  }

  function tickTimer() {
    if (state !== 'playing') return;
    var remaining = Math.max(0, roundEnd - performance.now());
    timeEl.textContent = (remaining / 1000).toFixed(1) + 's';
    if (remaining <= 0) {
      endRound();
      return;
    }
    timerRaf = requestAnimationFrame(tickTimer);
  }

  function startRound() {
    score = 0;
    updateScore();
    state = 'playing';
    roundEnd = performance.now() + ROUND_MS;
    msg.style.display = 'none';
    spawnDot();
    tickTimer();
  }

  function endRound() {
    state = 'over';
    clearTimeout(dotTimeout);
    clearTimeout(spawnTimeout);
    dot.style.display = 'none';
    var best = getBest();
    var isNew = best === null || score > best;
    if (isNew) setBest(score);
    renderBest();
    msg.innerHTML = "time's up — score: " + score + (isNew ? ' — new best!' : '') + '<span>click to play again</span>';
    msg.style.display = 'block';
  }

  dot.addEventListener('click', function (e) {
    e.stopPropagation();
    if (state !== 'playing') return;
    clearTimeout(dotTimeout);
    dot.style.display = 'none';
    score++;
    updateScore();
    spawnTimeout = setTimeout(spawnDot, 150 + Math.random() * 250);
  });

  area.addEventListener('click', function () {
    if (state === 'idle' || state === 'over') startRound();
  });

  renderBest();
</script>

</body>
</html>
