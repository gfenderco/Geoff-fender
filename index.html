<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shrink game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
    touch-action: manipulation;
  }
  #box {
    position: absolute;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
    transition: box-shadow 0.15s ease;
  }
  #box:hover {
    box-shadow: 0 0 30px rgba(255,255,255,0.9);
  }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    opacity: 0.7;
    user-select: none;
    line-height: 1.6;
  }
  #hud .row {
    display: flex;
    gap: 6px;
  }
  #hud .label {
    opacity: 0.6;
  }
  #msg {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 22px;
    text-align: center;
    display: none;
    user-select: none;
  }
  #msg span {
    display: block;
    opacity: 0.6;
    font-size: 14px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div id="hud">
  <div class="row"><span class="label">time:</span><span id="time">0.00s</span></div>
  <div class="row"><span class="label">clicks:</span><span id="count">0</span></div>
</div>
<div id="box"></div>
<div id="msg"></div>

<script>
  var box = document.getElementById('box');
  var hud = document.getElementById('count');
  var timeEl = document.getElementById('time');
  var msg = document.getElementById('msg');

  var START_SIZE = 160;
  var MIN_SIZE = 6;
  var SHRINK_FACTOR = 0.85;

  var size = START_SIZE;
  var clicks = 0;
  var startTime = null;
  var finalTime = null;
  var rafId = null;

  function fmt(ms) {
    return (ms / 1000).toFixed(2) + 's';
  }

  function tick() {
    if (startTime !== null && finalTime === null) {
      timeEl.textContent = fmt(performance.now() - startTime);
      rafId = requestAnimationFrame(tick);
    }
  }

  function placeCentered() {
    var x = (window.innerWidth - size) / 2;
    var y = (window.innerHeight - size) / 2;
    box.style.left = x + 'px';
    box.style.top = y + 'px';
  }

  function placeRandom() {
    var maxX = Math.max(0, window.innerWidth - size);
    var maxY = Math.max(0, window.innerHeight - size);
    var x = Math.random() * maxX;
    var y = Math.random() * maxY;
    box.style.left = x + 'px';
    box.style.top = y + 'px';
  }

  function render() {
    box.style.width = size + 'px';
    box.style.height = size + 'px';
  }

  function reset() {
    size = START_SIZE;
    clicks = 0;
    startTime = null;
    finalTime = null;
    hud.textContent = clicks;
    timeEl.textContent = '0.00s';
    if (rafId) cancelAnimationFrame(rafId);
    msg.style.display = 'none';
    box.style.display = 'block';
    render();
    placeCentered();
  }

  box.addEventListener('click', function (e) {
    e.stopPropagation();

    if (startTime === null) {
      startTime = performance.now();
      rafId = requestAnimationFrame(tick);
    }

    clicks++;
    hud.textContent = clicks;

    size = Math.max(MIN_SIZE, size * SHRINK_FACTOR);
    render();

    if (size <= MIN_SIZE) {
      finalTime = performance.now() - startTime;
      timeEl.textContent = fmt(finalTime);
      if (rafId) cancelAnimationFrame(rafId);
      box.style.display = 'none';
      msg.innerHTML = 'cleared in ' + fmt(finalTime) + ' — ' + clicks + ' clicks<span>click to reset</span>';
      msg.style.display = 'block';
    } else {
      placeRandom();
    }
  });

  msg.addEventListener('click', reset);

  window.addEventListener('resize', function () {
    if (box.style.display !== 'none') {
      var rect = box.getBoundingClientRect();
      var maxX = Math.max(0, window.innerWidth - size);
      var maxY = Math.max(0, window.innerHeight - size);
      box.style.left = Math.min(rect.left, maxX) + 'px';
      box.style.top = Math.min(rect.top, maxY) + 'px';
    }
  });

  reset();
</script>

</body>
</html>
