<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shrink game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
    touch-action: manipulation;
  }
  #site-nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 42px;
    background: #0a0a0a;
    border-bottom: 1px solid #1f1f1f;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 10px;
    overflow-x: auto;
    z-index: 1000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    white-space: nowrap;
  }
  #site-nav a {
    color: #888;
    text-decoration: none;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 5px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  #site-nav a:hover { color: #fff; background: #1a1a1a; }
  #site-nav a.active { color: #000; background: #fff; }
  #game-area {
    position: fixed;
    top: 42px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }
  #box {
    position: absolute;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
    transition: box-shadow 0.15s ease;
  }
  #box:hover { box-shadow: 0 0 30px rgba(255,255,255,0.9); }
  #hud {
    position: absolute;
    top: 16px;
    left: 16px;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    opacity: 0.7;
    user-select: none;
    line-height: 1.6;
  }
  #hud .row { display: flex; gap: 6px; }
  #hud .label { opacity: 0.6; }
  #msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 22px;
    text-align: center;
    display: none;
    user-select: none;
  }
  #msg span {
    display: block;
    opacity: 0.6;
    font-size: 14px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<nav id="site-nav">
  <a href="index.html">Shrink Box</a>
  <a href="reaction.html">Reaction</a>
  <a href="dodge.html">Dodge</a>
  <a href="whack.html">Whack-a-Dot</a>
  <a href="memory.html">Memory</a>
  <a href="colormatch.html">Color Match</a>
</nav>

<div id="game-area">
  <div id="hud">
    <div class="row"><span class="label">time:</span><span id="time">0.00s</span></div>
    <div class="row"><span class="label">clicks:</span><span id="count">0</span></div>
  </div>
  <div id="box"></div>
  <div id="msg"></div>
</div>

<script>
  (function () {
    var links = document.querySelectorAll('#site-nav a');
    var here = location.pathname.split('/').pop() || 'index.html';
    links.forEach(function (a) {
      if (a.getAttribute('href') === here) a.classList.add('active');
    });
  })();

  var area = document.getElementById('game-area');
  var box = document.getElementById('box');
  var hud = document.getElementById('count');
  var timeEl = document.getElementById('time');
  var msg = document.getElementById('msg');

  var START_SIZE = 160;
  var MIN_SIZE = 6;
  var SHRINK_FACTOR = 0.85;

  var size = START_SIZE;
  var clicks = 0;
  var startTime = null;
  var finalTime = null;
  var rafId = null;

  function fmt(ms) {
    return (ms / 1000).toFixed(2) + 's';
  }

  function tick() {
    if (startTime !== null && finalTime === null) {
      timeEl.textContent = fmt(performance.now() - startTime);
      rafId = requestAnimationFrame(tick);
    }
  }

  function placeCentered() {
    var x = (area.clientWidth - size) / 2;
    var y = (area.clientHeight - size) / 2;
    box.style.left = x + 'px';
    box.style.top = y + 'px';
  }

  function placeRandom() {
    var maxX = Math.max(0, area.clientWidth - size);
    var maxY = Math.max(0, area.clientHeight - size);
    var x = Math.random() * maxX;
    var y = Math.random() * maxY;
    box.style.left = x + 'px';
    box.style.top = y + 'px';
  }

  function render() {
    box.style.width = size + 'px';
    box.style.height = size + 'px';
  }

  function reset() {
    size = START_SIZE;
    clicks = 0;
    startTime = null;
    finalTime = null;
    hud.textContent = clicks;
    timeEl.textContent = '0.00s';
    if (rafId) cancelAnimationFrame(rafId);
    msg.style.display = 'none';
    box.style.display = 'block';
    render();
    placeCentered();
  }

  box.addEventListener('click', function (e) {
    e.stopPropagation();

    if (startTime === null) {
      startTime = performance.now();
      rafId = requestAnimationFrame(tick);
    }

    clicks++;
    hud.textContent = clicks;

    size = Math.max(MIN_SIZE, size * SHRINK_FACTOR);
    render();

    if (size <= MIN_SIZE) {
      finalTime = performance.now() - startTime;
      timeEl.textContent = fmt(finalTime);
      if (rafId) cancelAnimationFrame(rafId);
      box.style.display = 'none';
      msg.innerHTML = 'cleared in ' + fmt(finalTime) + ' — ' + clicks + ' clicks<span>click to reset</span>';
      msg.style.display = 'block';
    } else {
      placeRandom();
    }
  });

  msg.addEventListener('click', reset);

  window.addEventListener('resize', function () {
    if (box.style.display !== 'none') {
      var rect = box.getBoundingClientRect();
      var maxX = Math.max(0, area.clientWidth - size);
      var maxY = Math.max(0, area.clientHeight - size);
      var areaRect = area.getBoundingClientRect();
      var relLeft = rect.left - areaRect.left;
      var relTop = rect.top - areaRect.top;
      box.style.left = Math.min(relLeft, maxX) + 'px';
      box.style.top = Math.min(relTop, maxY) + 'px';
    }
  });

  reset();
</script>

</body>
</html>
