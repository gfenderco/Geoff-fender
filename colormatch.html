<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>color match</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #000;
    overflow: hidden;
    touch-action: manipulation;
  }
  #site-nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 42px;
    background: #0a0a0a;
    border-bottom: 1px solid #1f1f1f;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 0 10px;
    overflow-x: auto;
    z-index: 1000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    white-space: nowrap;
  }
  #site-nav a {
    color: #888;
    text-decoration: none;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 5px;
    transition: color 0.15s ease, background 0.15s ease;
  }
  #site-nav a:hover { color: #fff; background: #1a1a1a; }
  #site-nav a.active { color: #000; background: #fff; }
  #game-area {
    position: fixed;
    top: 42px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
  }
  #grid {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: grid;
    gap: 6px;
    width: min(80vmin, 520px);
    height: min(80vmin, 520px);
  }
  .swatch {
    border-radius: 6px;
    cursor: pointer;
  }
  #hud {
    position: absolute;
    top: 16px;
    left: 16px;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 14px;
    opacity: 0.7;
    user-select: none;
    line-height: 1.6;
  }
  #hud .row { display: flex; gap: 6px; }
  #hud .label { opacity: 0.6; }
  #msg {
    position: absolute;
    top: 12%;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-size: 22px;
    text-align: center;
    user-select: none;
    cursor: pointer;
  }
  #msg span {
    display: block;
    opacity: 0.6;
    font-size: 14px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<nav id="site-nav">
  <a href="index.html">Shrink Box</a>
  <a href="reaction.html">Reaction</a>
  <a href="dodge.html">Dodge</a>
  <a href="whack.html">Whack-a-Dot</a>
  <a href="memory.html">Memory</a>
  <a href="colormatch.html">Color Match</a>
</nav>

<div id="game-area">
  <div id="hud">
    <div class="row"><span class="label">time:</span><span id="time">—</span></div>
    <div class="row"><span class="label">round:</span><span id="round">0</span></div>
    <div class="row"><span class="label">best:</span><span id="best">—</span></div>
  </div>
  <div id="msg">click to start<span>find the square that's a different shade before time runs out</span></div>
  <div id="grid"></div>
</div>

<script>
  (function () {
    var links = document.querySelectorAll('#site-nav a');
    var here = location.pathname.split('/').pop() || 'index.html';
    links.forEach(function (a) {
      if (a.getAttribute('href') === here) a.classList.add('active');
    });
  })();

  var grid = document.getElementById('grid');
  var msg = document.getElementById('msg');
  var timeEl = document.getElementById('time');
  var roundEl = document.getElementById('round');
  var bestEl = document.getElementById('best');

  var BEST_KEY = 'colormatch_best_round';

  function getBest() {
    var v = null;
    try { v = localStorage.getItem(BEST_KEY); } catch (e) {}
    return v ? parseInt(v, 10) : null;
  }
  function setBest(s) {
    try { localStorage.setItem(BEST_KEY, String(s)); } catch (e) {}
  }
  function renderBest() {
    var b = getBest();
    bestEl.textContent = b !== null ? b : '—';
  }

  var state = 'idle';
  var round = 0;
  var oddIndex = -1;
  var roundEnd = null;
  var timerRaf = null;

  function buildGrid(size, diff) {
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
    grid.style.gridTemplateRows = 'repeat(' + size + ', 1fr)';
    var total = size * size;
    oddIndex = Math.floor(Math.random() * total);
    var base = 55 + Math.floor(Math.random() * 90);
    var sign = Math.random() < 0.5 ? 1 : -1;
    var oddVal = base + sign * diff;
    if (oddVal < 15 || oddVal > 240) oddVal = base - sign * diff;
    for (var i = 0; i < total; i++) {
      var sq = document.createElement('div');
      sq.className = 'swatch';
      var val = (i === oddIndex) ? oddVal : base;
      sq.style.background = 'rgb(' + val + ',' + val + ',' + val + ')';
      sq.setAttribute('data-i', i);
      sq.addEventListener('click', onSwatchClick);
      grid.appendChild(sq);
    }
  }

  function tick() {
    if (state !== 'playing') return;
    var remaining = Math.max(0, roundEnd - performance.now());
    timeEl.textContent = (remaining / 1000).toFixed(1) + 's';
    if (remaining <= 0) {
      gameOver();
      return;
    }
    timerRaf = requestAnimationFrame(tick);
  }

  function nextRound() {
    round++;
    roundEl.textContent = round;
    var size = Math.min(3 + Math.floor((round - 1) / 2), 7);
    var diff = Math.max(7, 44 - (round - 1) * 3);
    buildGrid(size, diff);
    var duration = Math.max(1800, 5200 - (round - 1) * 150);
    roundEnd = performance.now() + duration;
    state = 'playing';
    tick();
  }

  function startGame() {
    round = 0;
    msg.style.display = 'none';
    nextRound();
  }

  function gameOver() {
    state = 'over';
    var cleared = round - 1;
    var best = getBest();
    var isNew = best === null || cleared > best;
    if (isNew) setBest(cleared);
    renderBest();
    grid.innerHTML = '';
    timeEl.textContent = '—';
    msg.innerHTML = 'missed it — cleared ' + cleared + ' round' + (cleared === 1 ? '' : 's') + (isNew ? ' — new best!' : '') + '<span>click to play again</span>';
    msg.style.display = 'block';
  }

  function onSwatchClick(e) {
    if (state !== 'playing') return;
    var idx = parseInt(e.currentTarget.getAttribute('data-i'), 10);
    if (idx === oddIndex) {
      state = 'pause';
      setTimeout(nextRound, 300);
    } else {
      gameOver();
    }
  }

  msg.addEventListener('click', function () {
    if (state === 'idle' || state === 'over') startGame();
  });

  renderBest();
</script>

</body>
</html>
